{% extends "base.html" %}
{% block title %}Definir Nova Senha — Bontech{% endblock %}

{% block content %}
<section class="section" style="background:var(--slate-50);">
  <div class="container">
    <div class="card-panel" style="max-width:440px;margin:0 auto;">
      <h1 style="font-size:24px;font-weight:800;color:var(--navy-900);margin-bottom:8px;">Nova Senha</h1>
      <p style="font-size:14px;color:var(--slate-600);margin-bottom:20px;">Escolha uma nova senha segura para acessar sua conta.</p>

      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Nova Senha (mín. 6 caracteres)</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar Nova Senha</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Salvar Nova Senha</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
