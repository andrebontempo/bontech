{% extends "base.html" %}
{% block title %}Recuperar Senha — Bontech{% endblock %}

{% block content %}
<section class="section" style="background:var(--slate-50);">
  <div class="container">
    <div class="card-panel" style="max-width:440px;margin:0 auto;">
      <h1 style="font-size:24px;font-weight:800;color:var(--navy-900);margin-bottom:8px;">Recuperar Senha</h1>
      <p style="font-size:14px;color:var(--slate-600);margin-bottom:20px;">Informe o e-mail da sua conta para receber o link seguro de redefinição.</p>

      <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Seu E-mail</label>
          <input type="email" name="email" class="form-control" required placeholder="voce@empresa.com.br">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Enviar Link de Redefinição</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
