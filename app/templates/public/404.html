{% extends "base.html" %}
{% block title %}Página Não Encontrada — Bontech{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="card-panel" style="max-width:600px;margin:0 auto;text-align:center;padding:56px 32px;">
      <div style="font-size:56px;font-weight:800;color:var(--royal-500);line-height:1;">404</div>
      <h1 style="color:var(--navy-900);font-size:26px;font-weight:800;margin:12px 0;">{{ error_title or 'Página não encontrada' }}</h1>
      <p style="color:var(--slate-600);margin-bottom:26px;">{{ error_message or 'O endereço que você tentou acessar não existe ou foi movido.' }}</p>
      <a href="{{ url_for('public.index') }}" class="btn-cta-pill">
        <span>Voltar ao Início</span>
        <span class="arrow-circle">→</span>
      </a>
    </div>
  </div>
</section>
{% endblock %}
