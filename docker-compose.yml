services:
  db:
    image: postgres:16-alpine
    container_name: bontech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bontech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bontech_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bontech}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bontech} -d $${POSTGRES_DB:-bontech}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
      - proxy

  app:
    build: .
    container_name: bontech_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5015}:80"
    env_file:
      - .env
    environment:
      - PORT=80
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bontech}:${POSTGRES_PASSWORD:-bontech_secret_2026}@db:5432/${POSTGRES_DB:-bontech}
    volumes:
      - uploads_data:/usr/src/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      app-network:
      proxy:
        aliases:
          - bontech_app
          - bontech-app
          - bontech
          - bontech_wordpress
          - wordpress
          - bontech_nginx

volumes:
  pg_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
  proxy:
    external: true
